<h1>The law of <i>acceleration</i></h1>

$$
F = ma
$$

<p>Where $F$ refers to what is frequently referred to as <i>net force</i>, $m$ refers to <i>mass</i>, and $a$ refers to <i>acceleration</i>.</p>
